; Wynd Datalogger — Automatic Wastewater/Water Supply Monitoring Station
; Board: Wynd Datalogger V1.0.2 (ESP32-S3-WROOM-1-N16R8)
[env:wynd_station]
; pioarduino platform -> Arduino core 3.x / IDF 5.x. Required: this module is
; a 2024+ batch with AP_3v3 embedded PSRAM whose bootloader support only
; exists in IDF 5; the IDF 4.4 bootloader (espressif32@6.x) boot-loops.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
; PSRAM stays DISABLED on purpose: the board routes the shared SPI bus on
; GPIO35/36/37, which the octal PSRAM claims when enabled. App needs <100KB.
board_build.arduino.memory_type = dio_qspi
board_build.flash_mode = dio
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DTINY_GSM_MODEM_SIM7600        ; SIMCom A7682S uses the A76xx/SIM7600 AT set
    -DTINY_GSM_RX_BUFFER=1024   ; keep each AT+CIPRXGET request under the modem limit (~1500B)
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    arduino-libraries/Ethernet@^2.0.2
    vshymanskyy/TinyGSM@^0.12.0
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8
    digitaldragon/SSLClient@^1.3.2
    vshymanskyy/StreamDebugger@^1.0.1
